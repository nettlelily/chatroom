<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>临时网页聊天室</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app">
      <section id="authPanel" class="card join-card" aria-labelledby="authTitle">
        <p class="eyebrow">Text Chatroom</p>
        <h1 id="authTitle">临时网页聊天室</h1>
        <p class="muted">匿名可直接进入但下线后不保留；注册账号后，下次登录还能看到账号历史消息。</p>

        <div class="auth-grid">
          <section class="auth-block" aria-labelledby="guestTitle">
            <h2 id="guestTitle">匿名进入</h2>
            <p class="muted small">系统会分配一个随机临时昵称，离开后失效；发送 <strong>@Claude</strong> 时会唤起机器人回复。</p>
            <button id="guestButton" type="button">匿名进入聊天室</button>
          </section>

          <section class="auth-block" aria-labelledby="accountTitle">
            <h2 id="accountTitle">账号模式</h2>
            <p class="muted small">注册后可登录，并看到最近保存的账号消息。</p>
            <div class="tabs" role="tablist" aria-label="账号操作">
              <button id="showLogin" class="tab active" type="button">登录</button>
              <button id="showRegister" class="tab" type="button">注册</button>
            </div>

            <form id="loginForm" class="auth-form">
              <label for="loginName">用户名</label>
              <input id="loginName" name="username" type="text" maxlength="20" autocomplete="username" required />
              <label for="loginPassword">密码</label>
              <input id="loginPassword" name="password" type="password" minlength="6" maxlength="72" autocomplete="current-password" required />
              <button type="submit">登录</button>
            </form>

            <form id="registerForm" class="auth-form hidden">
              <label for="registerName">用户名</label>
              <input id="registerName" name="username" type="text" maxlength="20" autocomplete="username" required />
              <label for="registerPassword">密码</label>
              <input id="registerPassword" name="password" type="password" minlength="6" maxlength="72" autocomplete="new-password" required />
              <button type="submit">注册并进入</button>
            </form>
          </section>
        </div>

        <p id="authMessage" class="status muted" role="status" aria-live="polite"></p>
      </section>

      <section id="chatPanel" class="card chat-card hidden" aria-label="聊天室">
        <header class="chat-header">
          <div>
            <h1>聊天室</h1>
            <p id="currentName" class="muted"></p>
            <p id="modeHint" class="muted small"></p>
            <p class="muted small">在聊天框里输入 <strong>@Claude</strong> 并带上问题，机器人会在群里回复。</p>
          </div>
          <div class="header-actions">
            <div class="online-badge">在线 <span id="onlineCount">0</span></div>
            <button id="logoutButton" class="ghost-button hidden" type="button">退出账号</button>
          </div>
        </header>

        <section class="call-shell" aria-label="语音通话区域">
          <aside class="roster-panel" aria-labelledby="rosterTitle">
            <div class="panel-heading">
              <div>
                <h2 id="rosterTitle">在线用户</h2>
                <p id="rosterHint" class="muted small">登录账号后可发起 1 对 1 语音通话。</p>
              </div>
            </div>
            <div id="rosterList" class="roster-list"></div>
          </aside>

          <section id="callPanel" class="call-panel hidden" aria-labelledby="callPanelTitle">
            <div class="call-panel-top">
              <div>
                <h2 id="callPanelTitle">语音通话</h2>
                <p id="callPeer" class="muted"></p>
              </div>
              <span id="callStatusBadge" class="call-status-badge">空闲</span>
            </div>
            <p id="callStatusText" class="muted small">从在线用户列表中选择一个人开始语音通话。</p>
            <p id="callDeviceHint" class="muted small"></p>
            <div class="call-actions">
              <button id="startCallButton" type="button">开始通话</button>
              <button id="acceptCallButton" class="ghost-button hidden" type="button">接听</button>
              <button id="rejectCallButton" class="ghost-button hidden" type="button">拒绝</button>
              <button id="hangupCallButton" class="ghost-button hidden" type="button">挂断</button>
              <button id="muteCallButton" class="ghost-button hidden" type="button">静音麦克风</button>
              <button id="closeCallPanelButton" class="ghost-button hidden" type="button">关闭</button>
            </div>
            <audio id="remoteAudio" autoplay playsinline></audio>
          </section>
        </section>

        <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions"></div>

        <form id="messageForm" class="message-form">
          <label class="sr-only" for="messageInput">聊天内容</label>
          <input id="messageInput" name="message" type="text" maxlength="500" autocomplete="off" placeholder="输入文字消息..." />
          <button type="submit">发送</button>
        </form>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js"></script>
  </body>
</html>
